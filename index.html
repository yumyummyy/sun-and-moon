<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해와 달</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #111b32;
}

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
  color: #fff;
  background: linear-gradient(
    165deg,
    #498dc6 0%,
    #89bedc 50%,
    #c2dce5 76%,
    #f4d9ae 100%
  );
}

/* 하늘 */

.sky-night-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.night-remnant {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    95deg,
    rgba(7,16,39,.48) 0%,
    rgba(27,48,86,.23) 15%,
    transparent 42%
  );
  pointer-events: none;
}

.day-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 75% 85% at 102% 80%,
    rgba(255,229,177,.47),
    transparent 82%
  );
  pointer-events: none;
}

/* 별 */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: opacity 2.4s;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff9ed;
  border-radius: 50%;
  box-shadow: 0 0 7px #fff;
  animation: twinkle 3.5s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .25; }
  to { opacity: 1; }
}

.scene.sun-active .stars {
  opacity: .28;
}

/* 구름 */

.clouds {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 170px 33px at 78% 43%,
      #ffffff40,
      transparent
    ),
    radial-gradient(
      ellipse 200px 42px at 24% 63%,
      #b5cbe42e,
      transparent
    );
  filter: blur(12px);
}

/* 제목 */

.heading {
  position: absolute;
  z-index: 6;
  top: 9%;
  width: 100%;
  text-align: center;
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(25px, 4vw, 39px);
  font-weight: 300;
  letter-spacing: .3em;
  text-shadow: 0 2px 15px #0b153f7a;
  pointer-events: none;
  transition: text-shadow 2.4s ease;
}

.heading small {
  display: block;
  margin-top: 13px;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: .29em;
}

/* 낮 모드: 밝은 하늘 위에서도 제목이 또렷하도록 */
.scene.sun-active .heading {
  text-shadow:
    0 1px 3px rgba(16,40,82,.55),
    0 2px 16px rgba(16,40,82,.5);
}

/* 해와 달 */

.celestial {
  position: absolute;
  z-index: 7;
  top: 29%;
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  border: 0;
  background: transparent;
  cursor: pointer;
  transition: transform .4s, opacity 1.7s;
}

.celestial:hover {
  transform: scale(1.09);
}

.moon-btn {
  left: 12%;
}

.sun-btn {
  right: 12%;
}

.moon-icon {
  width: 94px;
  height: 94px;
  overflow: visible;
  filter: drop-shadow(0 0 12px #e6e9ff8a);
}

.sun-disc {
  position: relative;
  width: 79px;
  height: 79px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 42% 38%,
    #fffdf0,
    #ffe7a6 75%,
    #ffdc93
  );
  box-shadow:
    0 0 25px #ffe6a3,
    0 0 75px #ffcf7b88;
  animation: sunPulse 4.2s ease-in-out infinite alternate;
}

@keyframes sunPulse {
  from {
    box-shadow:
      0 0 22px #ffe6a3,
      0 0 62px #ffcf7b77;
  }
  to {
    box-shadow:
      0 0 32px #ffeab4,
      0 0 92px #ffcf7bb0;
  }
}

.scene.sun-active .moon-btn,
.scene.moon-active .sun-btn {
  opacity: .55;
}

/* 초원 */

.hill {
  position: absolute;
  width: 145%;
  border-radius: 50% 50% 0 0;
  pointer-events: none;
  transition: background 2.6s ease;
}

.hill-back {
  z-index: 2;
  bottom: -90px;
  left: -35%;
  height: 250px;
  background: #496d64;
}

.hill-front {
  z-index: 3;
  bottom: -120px;
  left: -5%;
  height: 260px;
  background: linear-gradient(
    #4b705d,
    #294b43
  );
}

.scene.sun-active .hill-back {
  background: #91b479;
}

.scene.sun-active .hill-front {
  background: linear-gradient(
    #79a96a,
    #4f8051
  );
}

/* 데이지 */

.flowers {
  position: absolute;
  z-index: 4;
  inset: 0;
  pointer-events: none;
}

.flower {
  position: absolute;
  width: 25px;
  height: 29px;
  transform-origin: bottom center;
  animation: sway 4s ease-in-out infinite alternate;
}

.stem {
  position: absolute;
  bottom: 0;
  left: 12px;
  width: 2px;
  height: 14px;
  background: #4a704c;
}

.petals {
  position: absolute;
  top: 2px;
  left: 7px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fffaf0;
  box-shadow:
    6px 0 #fffaf0,
    -6px 0 #fffaf0,
    0 6px #fffaf0,
    0 -6px #fffaf0,
    4px 4px #fffaf0,
    -4px -4px #fffaf0,
    4px -4px #fffaf0,
    -4px 4px #fffaf0;
}

.petals::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: #e8bf66;
}

@keyframes sway {
  0% { transform: rotate(-7deg); }
  50% { transform: rotate(3deg); }
  100% { transform: rotate(7deg); }
}

.flower:nth-child(3n) {
  animation-duration: 5.1s;
}

.flower:nth-child(3n+1) {
  animation-duration: 3.7s;
}

.flower:nth-child(4n) {
  animation-direction: alternate-reverse;
}

/* 벼리의 흰색 별 */

.secret-star {
  position: absolute;
  z-index: 5;
  left: calc(12% + 112px);
  top: 25%;
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  color: #ffffff;
  cursor: pointer;
  font: 29px Georgia, serif;
  text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 22px rgba(255,255,255,.55);
  animation: starPulse 3.8s ease-in-out infinite alternate;
}

@keyframes starPulse {
  from {
    opacity: .55;
    transform: scale(.86);
  }
  to {
    opacity: 1;
    transform: scale(1.15);
  }
}

/* 숨겨진 제작자 코멘트 */

.flower.secret-flower {
  pointer-events: auto;
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}

.flower.secret-flower:focus-visible,
.secret-star:focus-visible,
.celestial:focus-visible {
  outline: 2px solid #fff8d5;
  outline-offset: 5px;
}

/* 프로필 팝업 (닫힐 때는 딜레이 없이, 열릴 때만 페이드) */

.modal-layer {
  position: absolute;
  z-index: 20;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(10,18,36,.42);
  backdrop-filter: blur(5px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: none;
}

.modal-layer.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity .85s ease,
    visibility .85s ease;
}

.profile {
  width: min(370px, 100%);
  max-height: min(65svh, 540px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 16px;
  background: rgba(241,244,252,.92);
  box-shadow: 0 18px 65px rgba(5,12,33,.3);
  color: #39435c;
  transform: translateY(24px) scale(.975);
}

.modal-layer.open .profile {
  transform: translateY(0) scale(1);
  transition: transform .85s cubic-bezier(.2,.7,.2,1);
}

.profile.sun-theme {
  background: rgba(255,251,241,.93);
  color: #5c5044;
}

.profile-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(105,113,135,.19);
  font: 12px Georgia, serif;
  letter-spacing: .22em;
}

.close-modal {
  border: 0;
  background: none;
  color: inherit;
  font: 26px Georgia, serif;
  cursor: pointer;
  padding: 0 4px;
}

.profile-body {
  padding: 22px 24px 27px;
  overflow-y: auto;
  overscroll-behavior: contain;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 2.1;
}

.profile-body h2 {
  font-size: 27px;
  font-weight: 300;
  margin: 0 0 20px;
}

.profile-body p {
  margin: 0 0 16px;
}

.profile-body hr {
  border: 0;
  border-top: 1px solid rgba(105,113,135,.2);
  margin: 24px 0;
}

/* 모바일 */

@media (max-width: 600px) {
  .heading {
    top: 12%;
  }

  .celestial {
    top: 33%;
    width: 85px;
    height: 85px;
  }

  .moon-btn {
    left: 5%;
  }

  .sun-btn {
    right: 5%;
  }

  .moon-icon {
    width: 75px;
    height: 75px;
  }

  .sun-disc {
    width: 62px;
    height: 62px;
  }

  .secret-star {
    left: calc(5% + 80px);
    top: 27%;
  }

  .hill-back {
    height: 180px;
    bottom: -65px;
  }

  .hill-front {
    height: 200px;
    bottom: -95px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="scene moon-active" id="scene">

  <!-- 곡선형 밤하늘 -->

  <svg
    class="sky-night-svg"
    viewBox="0 0 1000 700"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <defs>
      <linearGradient
        id="nightColors"
        x1="0" y1="0"
        x2=".15" y2="1"
      >
        <stop offset="0%" stop-color="#071027"/>
        <stop offset="58%" stop-color="#1b3056"/>
        <stop offset="100%" stop-color="#606a88"/>
      </linearGradient>

      <filter
        id="softEdge"
        x="-60%" y="-60%"
        width="220%" height="220%"
        color-interpolation-filters="sRGB"
      >
        <feGaussianBlur stdDeviation="72"/>
      </filter>

      <mask
        id="nightMask"
        maskUnits="userSpaceOnUse"
        x="0" y="0"
        width="1000" height="700"
        maskContentUnits="userSpaceOnUse"
      >
        <path
          id="nightCurve"
          fill="white"
          filter="url(#softEdge)"
          d="M -300 -300 L 840 -300 L 840 0 C 900 240 1090 420 1320 700 L -300 1000 Z"
        />
      </mask>
    </defs>

    <rect
      x="0" y="0"
      width="1000" height="700"
      fill="url(#nightColors)"
      mask="url(#nightMask)"
    />
  </svg>

  <div class="night-remnant"></div>
  <div class="day-glow"></div>

  <div class="stars" id="stars"></div>
  <div class="clouds"></div>

  <!-- 제목 -->

  <div class="heading">
    해와 달
    <small>THE SUN AND THE MOON</small>
  </div>

  <!-- SVG 달 -->

  <button
    class="celestial moon-btn"
    id="moon"
    type="button"
    aria-label="달빛 선택"
    aria-pressed="true"
  >
    <svg
      class="moon-icon"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <defs>
        <linearGradient
          id="moonFill"
          x1="0" y1="0"
          x2="1" y2="1"
        >
          <stop stop-color="#fffdf7"/>
          <stop offset="1" stop-color="#dce6ff"/>
        </linearGradient>
      </defs>

      <path
        d="M65 10C44 15 29 33 29 55c0 21 16 37 36 39C32 100 8 79 8 51 8 25 30 6 55 6c4 0 7 1 10 4Z"
        fill="url(#moonFill)"
      />
    </svg>
  </button>

  <!-- 해 -->

  <button
    class="celestial sun-btn"
    id="sun"
    type="button"
    aria-label="햇살 선택"
    aria-pressed="false"
  >
    <span class="sun-disc"></span>
  </button>

  <!-- 초원 -->

  <div class="hill hill-back"></div>
  <div class="hill hill-front" id="hillFront"></div>

  <!-- 데이지 -->

  <div class="flowers" id="flowers"></div>

  <!-- 벼리의 흰색 별 -->

  <button
    type="button"
    class="secret-star"
    id="catStar"
    aria-label="벼리 이야기 열기"
    title="반짝이는 별"
  >✦</button>

  <!-- 팝업 -->

  <div
    class="modal-layer"
    id="modalLayer"
    aria-hidden="true"
  >
    <section
      class="profile"
      id="profile"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileLabel"
      tabindex="-1"
    >
      <div class="profile-head">
        <span id="profileLabel"></span>

        <button
          type="button"
          class="close-modal"
          id="closeModal"
          aria-label="프로필 닫기"
        >×</button>
      </div>

      <div class="profile-body" id="profileBody">
        <h2 id="profileName"></h2>
      </div>
    </section>
  </div>

</main>

<script>
(() => {

  const scene = document.getElementById('scene');
  const curve = document.getElementById('nightCurve');
  const stars = document.getElementById('stars');
  const flowers = document.getElementById('flowers');
  const hillFront = document.getElementById('hillFront');

  /* 별 배치 */

  const starPositions = [
    [15,20], [35,35], [65,15], [83,45],
    [51,60], [8,42], [27,12], [73,33],
    [90,17], [44,48], [57,27], [12,61],
    [82,66]
  ];

  starPositions.forEach(([x,y],i) => {
    const star = document.createElement('i');

    star.className = 'star';
    star.style.left = x + '%';
    star.style.top = y + '%';
    star.style.animationDelay = i * .26 + 's';

    stars.append(star);
  });

  /* 데이지 배치 (x%, 깊이 단계, 크기) */

  const flowerPositions = [
    [12,11,.85],
    [27,7,.65],
    [66,10,.85],
    [84,5,.7],
    [48,4,.6],
    [73,3,.55],
    [19,2,.55],
    [88,9,.7],
    [37,12,.75],
    [60,6,.68]
  ];

  const flowerEls = [];

  flowerPositions.forEach(([x,y,z],i) => {
    const isSecret = i === 3;

    const flower = document.createElement(
      isSecret ? 'button' : 'div'
    );

    flower.className =
      'flower' + (isSecret ? ' secret-flower' : '');

    if (isSecret) {
      flower.type = 'button';
      flower.setAttribute(
        'aria-label',
        '제작자 코멘트 열기'
      );
      flower.title = '작은 데이지';

      flower.addEventListener('click', () => {
        openProfile('creator');
      });
    }

    flower.style.left = x + '%';
    flower.style.scale = z;
    flower.style.animationDelay = i * .42 + 's';

    flower.innerHTML =
      '<span class="stem"></span>' +
      '<span class="petals"></span>';

    flowers.append(flower);
    flowerEls.push({ el: flower, x, y });
  });

  /* 데이지를 언덕 곡선 위에 정확히 앉히기 (화면 비율이 바뀌어도 유지) */

  function layoutFlowers() {
    const sceneRect = scene.getBoundingClientRect();
    const hill = hillFront.getBoundingClientRect();

    const cx = hill.left + hill.width / 2;
    const rx = hill.width / 2;
    const ry = hill.height / 2;

    flowerEls.forEach(({ el, x, y }) => {
      const px = sceneRect.left + sceneRect.width * x / 100 + 12;
      const dx = Math.max(-1, Math.min(1, (px - cx) / rx));

      const surfaceTop =
        hill.top + ry * (1 - Math.sqrt(1 - dx * dx));

      // y가 작을수록 언덕 안쪽(앞쪽)에 깊게 심는다
      const depth = 12 + (12 - y) * 5;

      el.style.bottom =
        (sceneRect.bottom - surfaceTop - depth) + 'px';
    });
  }

  layoutFlowers();
  addEventListener('resize', layoutFlowers);

  /* 하늘 전환 애니메이션 */

  const endpoints = {
    sun: {
      top: 145,
      bottom: 390
    },
    moon: {
      top: 900,
      bottom: 1370
    }
  };

  let current = { ...endpoints.moon };
  let frame = 0;

  function draw(v) {
    const t = v.top;
    const b = v.bottom;

    curve.setAttribute(
      'd',
      `M -350 -350
       L ${t} -350
       L ${t} 0
       C ${t+10} 235 ${b-220} 445 ${b} 700
       L -350 1050 Z`
    );
  }

  draw(current);

  function choose(type) {
    const target = endpoints[type];

    scene.classList.toggle(
      'sun-active',
      type === 'sun'
    );

    scene.classList.toggle(
      'moon-active',
      type === 'moon'
    );

    document.getElementById('sun').setAttribute(
      'aria-pressed',
      String(type === 'sun')
    );

    document.getElementById('moon').setAttribute(
      'aria-pressed',
      String(type === 'moon')
    );

    cancelAnimationFrame(frame);

    const start = { ...current };
    const startTime = performance.now();
    const duration = 2900;

    function step(now) {
      const p = Math.min(
        1,
        (now - startTime) / duration
      );

      const e = p < .5
        ? 4 * p * p * p
        : 1 - Math.pow(-2 * p + 2, 3) / 2;

      current = {
        top: start.top + (target.top - start.top) * e,
        bottom: start.bottom + (target.bottom - start.bottom) * e
      };

      draw(current);

      if (p < 1) {
        frame = requestAnimationFrame(step);
      }
    }

    if (matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches) {
      current = { ...target };
      draw(current);
    } else {
      frame = requestAnimationFrame(step);
    }
  }

  /* 프로필 팝업 */

  const modal = document.getElementById('modalLayer');
  const profile = document.getElementById('profile');
  const body = document.getElementById('profileBody');
  const closeButton = document.getElementById('closeModal');

  let previousFocus = null;

  function openProfile(type) {
    previousFocus = document.activeElement;

    if (type === 'moon' || type === 'sun') {
      choose(type);
    }

    const isMoon = type === 'moon';

    const labels = {
      moon: '소꿉친구',
      sun: '약혼자',
      cat: '집고양이',
      creator: '제작자 코멘트'
    };

    document.getElementById('profileLabel').textContent =
      labels[type];

    profile.classList.toggle(
      'sun-theme',
      type === 'sun' || type === 'creator'
    );

    if (type === 'cat') {

      body.innerHTML = `
        <h2 id="profileName">✦ 벼리</h2>
        <p>달빛과 함께 사는 고양이.</p>
        <hr>
        <p>벼리의 사진과 이야기가 들어갈 자리입니다.</p>
      `;

    } else if (type === 'creator') {

      body.innerHTML = `
        <p>작은 데이지를 발견하셨네요.</p>
        <hr>
        <p>제작 비하인드와 소소한 이야기가 들어갈 자리입니다.</p>
      `;

    } else if (isMoon) {

      body.innerHTML = `
        <h2 id="profileName">달빛</h2>
        <p>오랫동안 하늘의 곁에 머물렀던 사람.</p>
        <hr>
        <p>나이　30세</p>
        <p>직업　변호사</p>
        <p>취미　춤</p>
        <hr>
        <p>상세 프로필이 들어갈 자리입니다.</p>
        <hr>
        <p>내가 너를 사랑해도 되는 걸까.</p>
      `;

    } else {

      body.innerHTML = `
        <h2 id="profileName">햇살</h2>
        <p>하늘과 함께한 시간을 사진으로 남기는 사람.</p>
        <hr>
        <p>나이　30세</p>
        <p>취미　사진</p>
        <hr>
        <p>상세 프로필이 들어갈 자리입니다.</p>
        <hr>
        <p>사랑해도 돼?</p>
      `;
    }

    body.scrollTop = 0;

    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');

    closeButton.focus();
  }

  function closeProfile() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');

    if (previousFocus && previousFocus.focus) {
      previousFocus.focus();
    }
  }

  /* 클릭 이벤트 */

  document.getElementById('moon')
    .addEventListener('click', () => {
      openProfile('moon');
    });

  document.getElementById('sun')
    .addEventListener('click', () => {
      openProfile('sun');
    });

  document.getElementById('catStar')
    .addEventListener('click', () => {
      openProfile('cat');
    });

  closeButton.addEventListener('click', closeProfile);

  modal.addEventListener('click', e => {
    if (e.target === modal) {
      closeProfile();
    }
  });

  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;

    if (e.key === 'Escape') {
      closeProfile();
    }

    if (e.key === 'Tab') {
      if (document.activeElement !== closeButton) {
        e.preventDefault();
        closeButton.focus();
      }
    }
  });

})();
</script>

</body>
</html>
