<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해와 달</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #111b32;
}

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
  color: #fff;
  background: linear-gradient(
    165deg,
    #498dc6 0%,
    #89bedc 50%,
    #c2dce5 76%,
    #f4d9ae 100%
  );
}

/* 하늘 */

.sky-night-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.night-remnant {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    95deg,
    rgba(7,16,39,.48) 0%,
    rgba(27,48,86,.23) 15%,
    transparent 42%
  );
  pointer-events: none;
}

.day-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 75% 85% at 102% 80%,
    rgba(255,229,177,.47),
    transparent 82%
  );
  pointer-events: none;
}

/* 별 */

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  transition: opacity 2.4s;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff9ed;
  border-radius: 50%;
  box-shadow: 0 0 7px #fff;
  animation: twinkle 3.5s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .25; }
  to { opacity: 1; }
}

.scene.sun-active .stars {
  opacity: .28;
}

/* 구름 */

.clouds {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse 170px 33px at 78% 43%,
      #ffffff40,
      transparent
    ),
    radial-gradient(
      ellipse 200px 42px at 24% 63%,
      #b5cbe42e,
      transparent
    );
  filter: blur(12px);
}

/* 제목 */

.heading {
  position: absolute;
  z-index: 6;
  top: 9%;
  width: 100%;
  text-align: center;
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(25px, 4vw, 39px);
  font-weight: 300;
  letter-spacing: .3em;
  text-shadow: 0 2px 15px #0b153f7a;
  pointer-events: none;
  transition: text-shadow 2.4s ease;
}

.heading small {
  display: block;
  margin-top: 13px;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: .29em;
}

/* 낮 모드: 밝은 하늘 위에서도 제목이 또렷하도록 */
.scene.sun-active .heading {
  text-shadow:
    0 1px 3px rgba(16,40,82,.55),
    0 2px 16px rgba(16,40,82,.5);
}

/* 해와 달 */

.celestial {
  position: absolute;
  z-index: 7;
  top: 29%;
  display: grid;
  place-items: center;
  width: 112px;
  height: 112px;
  border: 0;
  background: transparent;
  cursor: pointer;
  transition: transform .4s, opacity 1.7s;
}

.celestial:hover {
  transform: scale(1.09);
}

.moon-btn {
  left: 12%;
}

.sun-btn {
  right: 12%;
}

.moon-icon {
  width: 94px;
  height: 94px;
  overflow: visible;
  filter: drop-shadow(0 0 12px #e6e9ff8a);
}

.sun-disc {
  position: relative;
  width: 79px;
  height: 79px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 42% 38%,
    #fffdf0,
    #ffe7a6 75%,
    #ffdc93
  );
  box-shadow:
    0 0 25px #ffe6a3,
    0 0 75px #ffcf7b88;
  animation: sunPulse 4.2s ease-in-out infinite alternate;
}

@keyframes sunPulse {
  from {
    box-shadow:
      0 0 22px #ffe6a3,
      0 0 62px #ffcf7b77;
  }
  to {
    box-shadow:
      0 0 32px #ffeab4,
      0 0 92px #ffcf7bb0;
  }
}

.scene.sun-active .moon-btn,
.scene.moon-active .sun-btn {
  opacity: .55;
}

/* 초원 */

.hill {
  position: absolute;
  width: 145%;
  border-radius: 50% 50% 0 0;
  pointer-events: none;
  transition: background 2.6s ease;
}

.hill-back {
  z-index: 2;
  bottom: -90px;
  left: -35%;
  height: 250px;
  background: #496d64;
}

.hill-front {
  z-index: 3;
  bottom: -120px;
  left: -5%;
  height: 260px;
  background: linear-gradient(
    #4b705d,
    #294b43
  );
}

.scene.sun-active .hill-back {
  background: #91b479;
}

.scene.sun-active .hill-front {
  background: linear-gradient(
    #79a96a,
    #4f8051
  );
}

/* 데이지 */

.flowers {
  position: absolute;
  z-index: 4;
  inset: 0;
  pointer-events: none;
}

.flower {
  position: absolute;
  width: 25px;
  height: 29px;
  transform-origin: bottom center;
  animation: sway 4s ease-in-out infinite alternate;
}

.stem {
  position: absolute;
  bottom: 0;
  left: 12px;
  width: 2px;
  height: 14px;
  background: #4a704c;
}

.petals {
  position: absolute;
  top: 2px;
  left: 7px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fffaf0;
  box-shadow:
    6px 0 #fffaf0,
    -6px 0 #fffaf0,
    0 6px #fffaf0,
    0 -6px #fffaf0,
    4px 4px #fffaf0,
    -4px -4px #fffaf0,
    4px -4px #fffaf0,
    -4px 4px #fffaf0;
}

.petals::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: #e8bf66;
}

@keyframes sway {
  0% { transform: rotate(-7deg); }
  50% { transform: rotate(3deg); }
  100% { transform: rotate(7deg); }
}

.flower:nth-child(3n) {
  animation-duration: 5.1s;
}

.flower:nth-child(3n+1) {
  animation-duration: 3.7s;
}

.flower:nth-child(4n) {
  animation-direction: alternate-reverse;
}

/* 벼리의 흰색 별 */

.secret-star {
  position: absolute;
  z-index: 5;
  left: calc(12% + 112px);
  top: 25%;
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  color: #ffffff;
  cursor: pointer;
  font: 29px Georgia, serif;
  text-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 22px rgba(255,255,255,.55);
  animation: starPulse 3.8s ease-in-out infinite alternate;
}

@keyframes starPulse {
  from {
    opacity: .55;
    transform: scale(.86);
  }
  to {
    opacity: 1;
    transform: scale(1.15);
  }
}

/* 숨겨진 제작자 코멘트 */

.flower.secret-flower {
  pointer-events: auto;
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}

.flower.secret-flower:focus-visible,
.secret-star:focus-visible,
.celestial:focus-visible {
  outline: 2px solid #fff8d5;
  outline-offset: 5px;
}

/* 프로필 팝업 (닫힐 때는 딜레이 없이, 열릴 때만 페이드) */

.modal-layer {
  position: absolute;
  z-index: 20;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(10,18,36,.42);
  backdrop-filter: blur(5px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: none;
}

.modal-layer.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity .85s ease,
    visibility .85s ease;
}

.profile {
  width: min(310px, 100%);
  max-height: min(54svh, 440px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 16px;
  background: rgba(241,244,252,.58);
  -webkit-backdrop-filter: blur(14px);
          backdrop-filter: blur(14px);
  box-shadow: 0 18px 65px rgba(5,12,33,.3);
  color: #000;
  transform: translateY(24px) scale(.975);
}

.modal-layer.open .profile {
  transform: translateY(0) scale(1);
  transition: transform .85s cubic-bezier(.2,.7,.2,1);
}

.profile.sun-theme {
  background: rgba(255,251,241,.58);
  color: #000;
}

.profile-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 20px;
  border-bottom: 1px solid rgba(105,113,135,.19);
  font: 12px Georgia, serif;
  letter-spacing: .22em;
}

.close-modal {
  border: 0;
  background: none;
  color: inherit;
  font: 26px Georgia, serif;
  cursor: pointer;
  padding: 0 4px;
}

.profile-body {
  padding: 22px 24px 27px;
  overflow-y: auto;
  overscroll-behavior: contain;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 2.1;
}

.profile-body h2 {
  font-size: 27px;
  font-weight: 300;
  margin: 0 0 20px;
}

.profile-body p {
  margin: 0 0 16px;
}

.profile-body hr {
  border: 0;
  border-top: 1px solid rgba(105,113,135,.2);
  margin: 24px 0;
}

/* 링크 박스를 누르면 뜨는 새 박스 */

.sheet-layer {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(10,18,36,.18);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: none;
}

.sheet-layer.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity .35s ease,
    visibility .35s ease;
}

.sheet {
  width: min(280px, 100%);
  max-height: min(46svh, 380px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 14px;
  background: #fff;
  color: #000;
  box-shadow: 0 18px 50px rgba(5,12,33,.35);
  transform: translateY(14px) scale(.98);
}

.sheet-layer.open .sheet {
  transform: none;
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 10px 18px;
  border-bottom: 1px solid rgba(0,0,0,.12);
  font-family: 'Noto Serif KR', serif;
  font-size: 13px;
}

.sheet-body {
  padding: 16px 18px 20px;
  overflow-y: auto;
  overscroll-behavior: contain;
  font-family: 'Noto Serif KR', serif;
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-wrap;
}

/* 프로필 카드 */

.profile-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  line-height: 1.7;
}

.pc-box {
  background: #fffdf8;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 2px 12px rgba(20,28,50,.1);
}

/* 벼리: 사진 영역 투명 */
.pc-box.clear {
  background: none;
  box-shadow: none;
  padding: 0;
}

.pc-box.clear .pc-photo {
  background: none;
}

.pc-story {
  font-size: 13px;
}

.pc-top {
  display: flex;
  gap: 14px;
  align-items: center;
}

.pc-photo {
  flex: 0 0 84px;
  aspect-ratio: 2 / 3;
  border-radius: 8px;
  overflow: hidden;
  background: linear-gradient(160deg, #dfe6f4, #c9d3e8);
}

.pc-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pc-info {
  min-width: 0;
}

.pc-name {
  margin: 0 0 10px;
  font-size: 22px;
  font-weight: 300;
  line-height: 1.3;
}

.pc-age {
  margin-left: 8px;
  font-size: 13px;
  font-weight: 400;
}

.pc-trait {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(0,0,0,.14);
  font-size: 13px;
  line-height: 1.85;
  white-space: pre-wrap;
}

.pc-tl {
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  letter-spacing: .15em;
}

.pc-row {
  margin: 0 0 4px;
  font-size: 13px;
}

.pc-k {
  margin-right: 8px;
  padding-right: 8px;
  border-right: 1px solid rgba(0,0,0,.28);
}

.pc-eras {
  margin: 0;
}

.pc-era {
  display: flex;
  gap: 10px;
  margin: 0 0 8px;
  font-size: 13px;
  line-height: 1.6;
}

.pc-era dt {
  flex: 0 0 58px;
}

.pc-era dd {
  margin: 0;
}

.pc-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 11px 14px;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  border: 1px solid rgba(0,0,0,.25);
  border-radius: 10px;
  background: #fffdf8;
  box-shadow: 0 2px 12px rgba(20,28,50,.1);
  color: #000;
  font-size: 13px;
  text-decoration: none;
}

.pc-link:focus-visible {
  outline: 2px solid #000;
  outline-offset: 2px;
}

.pc-note-wrap {
  filter: drop-shadow(0 2px 4px rgba(20,28,50,.2));
  transform: rotate(-.8deg);
}

.pc-note {
  padding: 6px 24px 8px 14px;
  border-radius: 3px;
  background: repeating-linear-gradient(
    to bottom,
    #fffef5 0 27px,
    rgba(110,140,190,.4) 27px 28px
  );
  color: #000;
  font-family: 'Nanum Pen Script', cursive;
  font-size: 23px;
  line-height: 28px;
  white-space: pre-wrap;

  /* 오른쪽 가장자리의 뜯긴 반원 구멍 */
  -webkit-mask-image: radial-gradient(circle 6px at 100% 50%, transparent 5.5px, #000 6px);
          mask-image: radial-gradient(circle 6px at 100% 50%, transparent 5.5px, #000 6px);
  -webkit-mask-size: 100% 28px;
          mask-size: 100% 28px;
  -webkit-mask-repeat: repeat-y;
          mask-repeat: repeat-y;
}

/* 모바일 */

@media (max-width: 600px) {
  .heading {
    top: 12%;
  }

  .celestial {
    top: 33%;
    width: 85px;
    height: 85px;
  }

  .moon-btn {
    left: 5%;
  }

  .sun-btn {
    right: 5%;
  }

  .moon-icon {
    width: 75px;
    height: 75px;
  }

  .sun-disc {
    width: 62px;
    height: 62px;
  }

  .secret-star {
    left: calc(5% + 80px);
    top: 27%;
  }

  .hill-back {
    height: 180px;
    bottom: -65px;
  }

  .hill-front {
    height: 200px;
    bottom: -95px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="scene moon-active" id="scene">

  <!-- 곡선형 밤하늘 -->

  <svg
    class="sky-night-svg"
    viewBox="0 0 1000 700"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <defs>
      <linearGradient
        id="nightColors"
        x1="0" y1="0"
        x2=".15" y2="1"
      >
        <stop offset="0%" stop-color="#071027"/>
        <stop offset="58%" stop-color="#1b3056"/>
        <stop offset="100%" stop-color="#606a88"/>
      </linearGradient>

      <filter
        id="softEdge"
        x="-60%" y="-60%"
        width="220%" height="220%"
        color-interpolation-filters="sRGB"
      >
        <feGaussianBlur stdDeviation="72"/>
      </filter>

      <mask
        id="nightMask"
        maskUnits="userSpaceOnUse"
        x="0" y="0"
        width="1000" height="700"
        maskContentUnits="userSpaceOnUse"
      >
        <path
          id="nightCurve"
          fill="white"
          filter="url(#softEdge)"
          d="M -300 -300 L 840 -300 L 840 0 C 900 240 1090 420 1320 700 L -300 1000 Z"
        />
      </mask>
    </defs>

    <rect
      x="0" y="0"
      width="1000" height="700"
      fill="url(#nightColors)"
      mask="url(#nightMask)"
    />
  </svg>

  <div class="night-remnant"></div>
  <div class="day-glow"></div>

  <div class="stars" id="stars"></div>
  <div class="clouds"></div>

  <!-- 제목 -->

  <div class="heading">
    해와 달
  </div>

  <!-- SVG 달 -->

  <button
    class="celestial moon-btn"
    id="moon"
    type="button"
    aria-label="달빛 선택"
    aria-pressed="true"
  >
    <svg
      class="moon-icon"
      viewBox="0 0 100 100"
      aria-hidden="true"
    >
      <defs>
        <linearGradient
          id="moonFill"
          x1="0" y1="0"
          x2="1" y2="1"
        >
          <stop stop-color="#fffdf7"/>
          <stop offset="1" stop-color="#dce6ff"/>
        </linearGradient>
      </defs>

      <path
        d="M65 10C44 15 29 33 29 55c0 21 16 37 36 39C32 100 8 79 8 51 8 25 30 6 55 6c4 0 7 1 10 4Z"
        fill="url(#moonFill)"
      />
    </svg>
  </button>

  <!-- 해 -->

  <button
    class="celestial sun-btn"
    id="sun"
    type="button"
    aria-label="햇살 선택"
    aria-pressed="false"
  >
    <span class="sun-disc"></span>
  </button>

  <!-- 초원 -->

  <div class="hill hill-back"></div>
  <div class="hill hill-front" id="hillFront"></div>

  <!-- 데이지 -->

  <div class="flowers" id="flowers"></div>

  <!-- 벼리의 흰색 별 -->

  <button
    type="button"
    class="secret-star"
    id="catStar"
    aria-label="벼리 이야기 열기"
    title="반짝이는 별"
  >✦</button>

  <!-- 팝업 -->

  <div
    class="modal-layer"
    id="modalLayer"
    aria-hidden="true"
  >
    <section
      class="profile"
      id="profile"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileLabel"
      tabindex="-1"
    >
      <div class="profile-head">
        <span id="profileLabel"></span>

        <button
          type="button"
          class="close-modal"
          id="closeModal"
          aria-label="프로필 닫기"
        >×</button>
      </div>

      <div class="profile-body" id="profileBody">
        <h2 id="profileName"></h2>
      </div>
    </section>

    <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
      <section
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheetTitle"
      >
        <div class="sheet-head">
          <span id="sheetTitle"></span>
          <button
            type="button"
            class="close-modal"
            id="closeSheet"
            aria-label="닫기"
          >×</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>
  </div>

</main>

<script>
(() => {

  const scene = document.getElementById('scene');
  const curve = document.getElementById('nightCurve');
  const stars = document.getElementById('stars');
  const flowers = document.getElementById('flowers');
  const hillFront = document.getElementById('hillFront');

  /* 별 배치 */

  const starPositions = [
    [15,20], [35,35], [65,15], [83,45],
    [51,60], [8,42], [27,12], [73,33],
    [90,17], [44,48], [57,27], [12,61],
    [82,66]
  ];

  starPositions.forEach(([x,y],i) => {
    const star = document.createElement('i');

    star.className = 'star';
    star.style.left = x + '%';
    star.style.top = y + '%';
    star.style.animationDelay = i * .26 + 's';

    stars.append(star);
  });

  /* 데이지 배치 (x%, 깊이 단계, 크기) */

  const flowerPositions = [
    [12,11,.85],
    [27,7,.65],
    [66,10,.85],
    [84,5,.7],
    [48,4,.6],
    [73,3,.55],
    [19,2,.55],
    [88,9,.7],
    [37,12,.75],
    [60,6,.68]
  ];

  const flowerEls = [];

  flowerPositions.forEach(([x,y,z],i) => {
    const isSecret = i === 3;

    const flower = document.createElement(
      isSecret ? 'button' : 'div'
    );

    flower.className =
      'flower' + (isSecret ? ' secret-flower' : '');

    if (isSecret) {
      flower.type = 'button';
      flower.setAttribute(
        'aria-label',
        '제작자 코멘트 열기'
      );
      flower.title = '작은 데이지';

      flower.addEventListener('click', () => {
        openProfile('creator');
      });
    }

    flower.style.left = x + '%';
    flower.style.scale = z;
    flower.style.animationDelay = i * .42 + 's';

    flower.innerHTML =
      '<span class="stem"></span>' +
      '<span class="petals"></span>';

    flowers.append(flower);
    flowerEls.push({ el: flower, x, y });
  });

  /* 데이지를 언덕 곡선 위에 정확히 앉히기 (화면 비율이 바뀌어도 유지) */

  function layoutFlowers() {
    const sceneRect = scene.getBoundingClientRect();
    const hill = hillFront.getBoundingClientRect();

    const cx = hill.left + hill.width / 2;
    const rx = hill.width / 2;
    const ry = hill.height / 2;

    flowerEls.forEach(({ el, x, y }) => {
      const px = sceneRect.left + sceneRect.width * x / 100 + 12;
      const dx = Math.max(-1, Math.min(1, (px - cx) / rx));

      const surfaceTop =
        hill.top + ry * (1 - Math.sqrt(1 - dx * dx));

      // y가 작을수록 언덕 안쪽(앞쪽)에 깊게 심는다
      const depth = 12 + (12 - y) * 5;

      el.style.bottom =
        (sceneRect.bottom - surfaceTop - depth) + 'px';
    });
  }

  layoutFlowers();
  addEventListener('resize', layoutFlowers);

  /* 하늘 전환 애니메이션 */

  const endpoints = {
    sun: {
      top: 145,
      bottom: 390
    },
    moon: {
      top: 720,
      bottom: 1040
    }
  };

  let current = { ...endpoints.moon };
  let frame = 0;

  function draw(v) {
    const t = v.top;
    const b = v.bottom;

    curve.setAttribute(
      'd',
      `M -350 -350
       L ${t} -350
       L ${t} 0
       C ${t+10} 235 ${b-220} 445 ${b} 700
       L -350 1050 Z`
    );
  }

  draw(current);

  function choose(type) {
    const target = endpoints[type];

    scene.classList.toggle(
      'sun-active',
      type === 'sun'
    );

    scene.classList.toggle(
      'moon-active',
      type === 'moon'
    );

    document.getElementById('sun').setAttribute(
      'aria-pressed',
      String(type === 'sun')
    );

    document.getElementById('moon').setAttribute(
      'aria-pressed',
      String(type === 'moon')
    );

    cancelAnimationFrame(frame);

    const start = { ...current };
    const startTime = performance.now();
    const duration = 2900;

    function step(now) {
      const p = Math.min(
        1,
        (now - startTime) / duration
      );

      const e = p < .5
        ? 4 * p * p * p
        : 1 - Math.pow(-2 * p + 2, 3) / 2;

      current = {
        top: start.top + (target.top - start.top) * e,
        bottom: start.bottom + (target.bottom - start.bottom) * e
      };

      draw(current);

      if (p < 1) {
        frame = requestAnimationFrame(step);
      }
    }

    if (matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches) {
      current = { ...target };
      draw(current);
    } else {
      frame = requestAnimationFrame(step);
    }
  }

  /* 프로필 팝업 */

  const modal = document.getElementById('modalLayer');
  const profile = document.getElementById('profile');
  const body = document.getElementById('profileBody');
  const closeButton = document.getElementById('closeModal');

  let previousFocus = null;

  const CREATOR_TMI = '제작 TMI가 들어갈 자리입니다.'; // 제작 TMI 내용

  let currentSheet = null;

  const PEOPLE = {
    moon: {
      name: '달빛',
      age: '33세',
      height: '188cm',
      job: '변호사',
      hobby: '춤',
      photo: '', // 2:3 비율 이미지 주소
      personality: '성격 설명이 들어갈 자리입니다.',
      eras: [
        ['중학교', '짧은 설명이 들어갈 자리입니다.'],
        ['고등학교', '짧은 설명이 들어갈 자리입니다.'],
        ['대학교', '짧은 설명이 들어갈 자리입니다.']
      ],
      facts: '달빛에 대해 아는 사실들이 들어갈 자리입니다.', // 보러가기를 누르면 뜨는 내용
      thought: [
        '또 아무 말도 못 했다. 오늘도 네 얼굴을 보고 나서야 알았다. 하루 종일 무슨 생각을 하든 결국 끝에는 네가 있다는 걸.',
        '내가 너를 사랑해도 되는 걸까. 이 질문을 몇 년째 하고 있는지 모르겠다. 법정에서는 이렇게 오래 망설인 적이 없는데. 증거도 논리도 다 있는데, 너 앞에서는 한 문장도 제대로 세우지 못한다.',
        '어릴 때부터 곁에 있었다는 게 이렇게 발목을 잡을 줄은 몰랐다. 소꿉친구라는 이름은 편하지만 그만큼 단단해서, 한 번 넘으면 다시는 돌아갈 수 없을 것 같다.',
        '춤을 추면 잠깐은 잊는다. 몸이 먼저 움직이니까, 생각할 틈이 없으니까. 근데 음악이 끝나고 숨이 가라앉으면 그 자리에 또 네가 서 있다.',
        '네가 웃을 때마다 나는 조금씩 비겁해진다. 모른 척하고, 괜찮은 척하고, 좋은 친구인 척하고. 그게 제일 안전하다는 걸 알아서.',
        '그래도 하나만 적어둘게. 네가 행복했으면 좋겠다는 마음은 거짓이 아니야. 그 행복 옆에 내가 없더라도. ...없더라도, 라고 쓰는 게 아직도 이렇게 아프지만.',
        '언젠가 이 노트를 네가 보게 된다면 그땐 변명하지 않을게. 내가 너를 사랑해도 되는 걸까. 그 답을 네 입으로 듣고 싶어서 아직도 여기 있는 거니까.'
      ].join('\n\n')
    },
    sun: {
      name: '햇살',
      age: '33세',
      height: '190cm',
      job: '○○',
      hobby: '사진',
      photo: '',
      personality: '성격 설명이 들어갈 자리입니다.',
      eras: [
        ['중학교', '짧은 설명이 들어갈 자리입니다.'],
        ['고등학교', '짧은 설명이 들어갈 자리입니다.'],
        ['대학교', '짧은 설명이 들어갈 자리입니다.']
      ],
      facts: '햇살에 대해 아는 사실들이 들어갈 자리입니다.',
      thought: [
        '사진을 정리하다가 또 멈췄다. 어느 폴더를 열어도 네가 있다. 일부러 찍은 게 아닌 것도 많은데, 돌아보면 전부 너를 향해 있었다.',
        '사랑해도 돼? 이 말을 몇 번이나 입안에서 굴렸는지 모르겠다. 약혼이라는 말이 생겼는데도 이상하게 이 질문은 없어지지 않는다. 이름이 붙는다고 마음까지 허락받은 건 아니니까.',
        '너는 늘 괜찮다고 말하지. 근데 나는 그 괜찮다는 말 뒤에 뭐가 있는지 알고 싶어. 카메라는 앞에 있는 것밖에 못 찍지만, 나는 네 뒤쪽이 궁금해.',
        '같이 보낸 시간이 너무 길어서 처음 좋아하게 된 순간이 언제인지도 기억이 안 나. 아침 햇빛처럼 어느새 번져 있었던 것 같아. 눈치챘을 땐 이미 방 안이 환했고, 되돌릴 수 없었어.',
        '무서운 건 거절이 아니야. 네가 나 때문에 억지로 웃는 거. 네 선택이 내 기대에 눌리는 거. 그래서 자꾸 묻는 거야. 사랑해도 되는지. 네가 아니라고 하면 그 대답까지 사진처럼 오래 간직할 테니까.',
        '그래도 이것만은 알아줘. 나는 네 곁에서 가장 좋은 빛을 기다리는 사람이야. 흐린 날에도, 늦은 저녁에도. 네가 고개를 돌려 나를 볼 때까지 셔터는 누르지 않고 기다릴게.',
        '사랑해도 돼?'
      ].join('\n\n')
    },
    cat: {
      name: '벼리',
      age: '7세',
      tagline: '달빛과 함께 사는 고양이.',
      photo: '', // 배경이 투명한 이미지(png) 주소
      clear: true
    }
  };

  function personHTML(p) {
    const photo = p.photo
      ? `<img src="${p.photo}" alt="${p.name}" loading="lazy">`
      : '';

    const rows =
      (p.tagline ? `<div class="pc-row">${p.tagline}</div>` : '') +
      (p.height ? `<div class="pc-row"><span class="pc-k">키</span>${p.height}</div>` : '') +
      (p.job ? `<div class="pc-row"><span class="pc-k">직업</span>${p.job}</div>` : '') +
      (p.hobby ? `<div class="pc-row"><span class="pc-k">최근 취미</span>${p.hobby}</div>` : '');

    const trait = p.personality
      ? `<div class="pc-trait"><span class="pc-tl">성격</span>${p.personality}</div>`
      : '';

    const eras = p.eras
      ? '<dl class="pc-box pc-eras">' +
        p.eras.map(([k, v]) =>
          `<div class="pc-era"><dt>${k}</dt><dd>${v}</dd></div>`
        ).join('') +
        '</dl>'
      : '';

    const link = p.facts
      ? `<button type="button" class="pc-link">
          <span>${p.name}에 대해 아는 사실들 (보러가기)</span>
          <span aria-hidden="true">›</span>
        </button>`
      : '';

    const note = p.thought
      ? `<div class="pc-note-wrap"><div class="pc-note">${p.thought}</div></div>`
      : '';

    return `
      <div class="profile-card">
        <div class="pc-box${p.clear ? ' clear' : ''}">
          <div class="pc-top">
            <div class="pc-photo">${photo}</div>
            <div class="pc-info">
              <h2 class="pc-name">${p.name}<span class="pc-age">${p.age}</span></h2>
              ${rows}
            </div>
          </div>
          ${trait}
        </div>
        ${eras}${link}${note}
      </div>
    `;
  }

  function openProfile(type) {
    previousFocus = document.activeElement;

    currentSheet =
      type === 'creator'
        ? { title: '제작 TMI', text: CREATOR_TMI }
        : (PEOPLE[type] && PEOPLE[type].facts)
          ? { title: PEOPLE[type].name + '에 대해 아는 사실들', text: PEOPLE[type].facts }
          : null;

    if (type === 'moon' || type === 'sun') {
      choose(type);
    }

    const isMoon = type === 'moon';

    const labels = {
      moon: '소꿉친구',
      sun: '소꿉친구(약혼자)',
      cat: '집고양이(길고양이 출신)',
      creator: '제작자 코멘트'
    };

    document.getElementById('profileLabel').textContent =
      labels[type];

    profile.classList.toggle(
      'sun-theme',
      type === 'sun' || type === 'creator'
    );

    if (type === 'cat') {

      body.innerHTML = personHTML(PEOPLE.cat);

    } else if (type === 'creator') {

      body.innerHTML = `
        <p>발견하셨군요!</p>
        <button type="button" class="pc-link">
          <span>제작 TMI 보기 (안보셔도 괜찮아요!)</span>
          <span aria-hidden="true">›</span>
        </button>
      `;

    } else {

      body.innerHTML = personHTML(PEOPLE[type]);
    }

    body.scrollTop = 0;

    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');

    closeButton.focus();
  }

  const sheetBox = document.getElementById('sheet');
  const sheetLayer = document.getElementById('sheetLayer');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetBody = document.getElementById('sheetBody');
  const closeSheetBtn = document.getElementById('closeSheet');
  let sheetFocus = null;

  function openSheet(sheet) {
    if (!sheet) return;

    sheetFocus = document.activeElement;

    // 열기 전 창과 같은 크기로 맞춤
    sheetBox.style.width = profile.offsetWidth + 'px';
    sheetBox.style.height = profile.offsetHeight + 'px';
    sheetBox.style.maxHeight = 'none';

    sheetTitle.textContent = sheet.title;
    sheetBody.textContent = sheet.text;
    sheetBody.scrollTop = 0;

    sheetLayer.classList.add('open');
    sheetLayer.setAttribute('aria-hidden', 'false');

    closeSheetBtn.focus();
  }

  function closeSheet(restore = true) {
    if (!sheetLayer.classList.contains('open')) return;

    sheetLayer.classList.remove('open');
    sheetLayer.setAttribute('aria-hidden', 'true');

    if (restore && sheetFocus && sheetFocus.focus) {
      sheetFocus.focus();
    }
  }

  function closeProfile() {
    closeSheet(false);
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');

    if (previousFocus && previousFocus.focus) {
      previousFocus.focus();
    }
  }

  /* 클릭 이벤트 */

  document.getElementById('moon')
    .addEventListener('click', () => {
      openProfile('moon');
    });

  document.getElementById('sun')
    .addEventListener('click', () => {
      openProfile('sun');
    });

  document.getElementById('catStar')
    .addEventListener('click', () => {
      openProfile('cat');
    });

  body.addEventListener('click', e => {
    if (e.target.closest('.pc-link')) {
      openSheet(currentSheet);
    }
  });

  closeSheetBtn.addEventListener('click', () => closeSheet());

  sheetLayer.addEventListener('click', e => {
    if (e.target === sheetLayer) {
      closeSheet();
    }
  });

  closeButton.addEventListener('click', closeProfile);

  modal.addEventListener('click', e => {
    if (e.target === modal) {
      closeProfile();
    }
  });

  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;

    const sheetOpen = sheetLayer.classList.contains('open');

    if (e.key === 'Escape') {
      if (sheetOpen) {
        closeSheet();
      } else {
        closeProfile();
      }
      return;
    }

    if (e.key === 'Tab') {
      const root = sheetOpen ? sheetLayer : profile;
      const items = [...root.querySelectorAll('button')];
      if (!items.length) return;

      const first = items[0];
      const last = items[items.length - 1];

      if (!root.contains(document.activeElement)) {
        e.preventDefault();
        first.focus();
      } else if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

})();
</script>

</body>
</html>
